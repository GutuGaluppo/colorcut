[package]
name = "colorcut"
version = "0.1.0"
description = "Local-first palette and cutout utility"
authors = ["ColorCut contributors"]
edition = "2021"

[lib]
name = "colorcut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"

